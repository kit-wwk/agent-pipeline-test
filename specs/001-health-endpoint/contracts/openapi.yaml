openapi: 3.1.0
info:
  title: Health Check API
  description: |
    HTTP health check endpoint for application and dependency status monitoring.
    Designed for Kubernetes liveness/readiness probe integration.
  version: 1.0.0
  contact:
    name: Agent Pipeline Test
  license:
    name: MIT

servers:
  - url: http://localhost:8080
    description: Local development server

paths:
  /health/live:
    get:
      summary: Liveness probe
      description: |
        Kubernetes liveness probe endpoint. Returns UP if the process is running.
        Does not check external dependencies. Use for detecting deadlocks or
        unrecoverable states that require container restart.
      operationId: getLiveness
      tags:
        - Health
      responses:
        "200":
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LivenessResponse"
              example:
                status: UP
                timestamp: "2026-02-22T10:30:00Z"

  /health/ready:
    get:
      summary: Readiness probe
      description: |
        Kubernetes readiness probe endpoint. Returns UP if the service can
        accept traffic. Checks all external dependencies (database, disk space).
        Use for controlling load balancer traffic routing.
      operationId: getReadiness
      tags:
        - Health
      responses:
        "200":
          description: Service is ready to accept traffic
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: UP
                timestamp: "2026-02-22T10:30:00Z"
                checks:
                  database:
                    status: UP
                    response_time_ms: 12.5
                  disk:
                    status: UP
                    path: "/"
                    percent_free: 45.2
                    threshold: 10
        "503":
          description: Service is not ready (one or more checks failed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: DOWN
                timestamp: "2026-02-22T10:30:00Z"
                checks:
                  database:
                    status: DOWN
                    response_time_ms: 200.0
                    error: Database connection failed
                  disk:
                    status: UP
                    path: "/"
                    percent_free: 45.2
                    threshold: 10

  /health:
    get:
      summary: Full health status
      description: |
        Complete health check with detailed component information.
        Intended for manual inspection and monitoring systems.
        Returns all component health details regardless of status.
      operationId: getHealth
      tags:
        - Health
      responses:
        "200":
          description: Health status with all component details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: One or more components unhealthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

components:
  schemas:
    HealthStatus:
      type: string
      enum:
        - UP
        - DOWN
        - WARNING
      description: |
        Health status indicator:
        - UP: Component is healthy
        - DOWN: Component is unhealthy (critical)
        - WARNING: Component is approaching thresholds

    LivenessResponse:
      type: object
      required:
        - status
        - timestamp
      properties:
        status:
          $ref: "#/components/schemas/HealthStatus"
        timestamp:
          type: string
          format: date-time
          description: ISO 8601 timestamp of the check

    ComponentHealth:
      type: object
      required:
        - status
      properties:
        status:
          $ref: "#/components/schemas/HealthStatus"
        response_time_ms:
          type: number
          format: float
          description: Time taken for health check in milliseconds
        error:
          type: string
          description: Sanitized error message (only present when status is DOWN)

    DatabaseHealth:
      allOf:
        - $ref: "#/components/schemas/ComponentHealth"
      description: Database connectivity health check result

    DiskHealth:
      allOf:
        - $ref: "#/components/schemas/ComponentHealth"
        - type: object
          required:
            - path
          properties:
            path:
              type: string
              description: Monitored filesystem path
              example: "/"
            total_bytes:
              type: integer
              format: int64
              description: Total disk space in bytes
            free_bytes:
              type: integer
              format: int64
              description: Available disk space in bytes
            percent_free:
              type: number
              format: float
              description: Percentage of free space (0-100)
            threshold:
              type: integer
              description: Critical threshold percentage
              default: 10

    HealthResponse:
      type: object
      required:
        - status
        - timestamp
      properties:
        status:
          $ref: "#/components/schemas/HealthStatus"
        timestamp:
          type: string
          format: date-time
          description: ISO 8601 timestamp of the check
        checks:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/ComponentHealth"
          description: Map of component name to health check result
          example:
            database:
              status: UP
              response_time_ms: 12.5
            disk:
              status: UP
              path: "/"
              percent_free: 45.2
              threshold: 10

tags:
  - name: Health
    description: Health check endpoints for monitoring and orchestration
